<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Княжеская битва</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #2b2b2b;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
    padding: 20px;
  }
  h1 { margin: 0 0 10px; font-size: 22px; }
  #status { margin: 8px 0; font-size: 16px; min-height: 22px; }
  #status.win { color: #7f7; font-weight: bold; }
  .board-wrap {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }
  #board {
    display: grid;
    grid-template-columns: repeat(3, 80px);
    grid-template-rows: repeat(4, 80px);
    border: 3px solid #888;
    user-select: none;
  }
  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
    text-align: center;
    line-height: 1.1;
  }
  .cell.light { background: #e8d9b5; }
  .cell.dark  { background: #b58863; }
  .cell .piece {
    width: 64px; height: 64px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #fff;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.3), 0 2px 4px rgba(0,0,0,.5);
    transition: transform .1s;
  }
  .piece.p1 { background: #c0392b; } /* игрок 1 — красный */
  .piece.p2 { background: #2980b9; } /* игрок 2 — синий */
  .cell.sel .piece { transform: scale(1.08); box-shadow: 0 0 0 3px #ff0, inset 0 0 0 2px rgba(255,255,255,.3); }
  .cell.target::after {
    content: '';
    position: absolute;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: rgba(0,255,0,.55);
    pointer-events: none;
  }
  .cell.target.capture::after {
    background: rgba(255,0,0,.6);
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 3px dashed #f33;
    box-sizing: border-box;
    background: rgba(255,0,0,.15);
  }
  .cell.lastmove { box-shadow: inset 0 0 0 4px #ff0; }

  .panel { width: 240px; background: #383838; border-radius: 8px; padding: 12px; }
  .panel h3 { margin: 0 0 8px; font-size: 15px; border-bottom: 1px solid #555; padding-bottom: 4px; }
  .reserve { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; min-height: 34px; }
  .reserve .piece {
    width: 40px; height: 40px; font-size: 9px; cursor: pointer;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    color: #fff; box-shadow: inset 0 0 0 2px rgba(255,255,255,.3);
  }
  .reserve .piece.p1 { background: #c0392b; }
  .reserve .piece.p2 { background: #2980b9; }
  .reserve .piece.sel { box-shadow: 0 0 0 3px #ff0; }
  .reserve .piece.disabled { opacity: .35; cursor: not-allowed; }
  .hint { font-size: 12px; color: #bbb; margin-bottom: 10px; }
  button {
    width: 100%; padding: 8px; margin-top: 8px; cursor: pointer;
    background: #555; color: #eee; border: 1px solid #777; border-radius: 4px;
  }
  button:hover { background: #666; }
  #log {
    font-size: 11px; color: #aaa; height: 100px; overflow-y: auto;
    background: #2a2a2a; border-radius: 4px; padding: 6px; margin-top: 10px;
  }
</style>
</head>
<body>

<h1>Княжеская битва</h1>
<div id="status">Ход игрока 1 (красные)</div>

<div class="board-wrap">
  <div id="board"></div>
  <div class="panel">
    <h3>Резерв игрока 1</h3>
    <div id="reserve1" class="reserve"></div>
    <h3>Резерв игрока 2</h3>
    <div id="reserve2" class="reserve"></div>
    <div class="hint" id="hint">Выберите фигуру на доске или в резерве.</div>
    <button id="restart">Новая игра</button>
    <div id="log"></div>
  </div>
</div>

<script>
/* ============ МОДЕЛЬ ============ */
const COLS = 3, ROWS = 4;
// types: K=князь, V=воевода, W=витязь, L=лучник, C=командир лучников
const NAMES = { K:'Князь', V:'Воевода', W:'Витязь', L:'Лучник', C:'Командир' };

let state = null;

function createInitialState() {
  return {
    board: [
      // row 0
      [ {type:'V', owner:1}, {type:'K', owner:1}, {type:'W', owner:1} ],
      // row 1
      [ null, {type:'L', owner:1}, null ],
      // row 2
      [ null, {type:'L', owner:2}, null ],
      // row 3
      [ {type:'W', owner:2}, {type:'K', owner:2}, {type:'V', owner:2} ]
    ],
    reserves: { 1: [], 2: [] },
    turn: 1,
    gameOver: false,
    winner: null,
    // визуальные
    selected: null,       // {kind:'board', r,c} | {kind:'reserve', owner, index}
    legalMoves: [],
    lastMove: null
  };
}

function clonePiece(p) { return p ? {type:p.type, owner:p.owner} : null; }

/* ============ ДВИЖЕНИЕ ФИГУР ============ */

// возвращает массив [dr,dc] возможных шагов фигуры данного типа/владельца в данной позиции
function getMovesForPiece(piece, r, c) {
  const dirs = [];
  const {type, owner} = piece;
  const forward = owner === 1 ? -1 : 1; // игрок 1 ходит вверх (к row 0), игрок 2 — вниз

  const addIf = (dr, dc) => {
    const nr = r + dr, nc = c + dc;
    if (nr<0||nr>=ROWS||nc<0||nc>=COLS) return;
    const target = state.board[nr][nc];
    if (target && target.owner === owner) return; // своя фигура
    dirs.push([dr, dc]);
  };

  switch(type) {
    case 'K': // король — 8 направлений по 1
    case 'C': // командир лучников — по сути тоже король, но назад по диагонали нельзя
      for (const dr of [-1,0,1])
        for (const dc of [-1,0,1]) {
          if (dr===0 && dc===0) continue;
          if (type === 'C') {
            // назад по диагонали нельзя: "назад" = в направлении, противоположном forward
            const isDiagonal = dr!==0 && dc!==0;
            const isBackward = dr === -forward;
            if (isDiagonal && isBackward) continue;
          }
          addIf(dr, dc);
        }
      break;
    case 'V': // ладья — 4 направления по 1
      addIf(-1,0); addIf(1,0); addIf(0,-1); addIf(0,1);
      break;
    case 'W': // слон — 4 диагонали по 1
      addIf(-1,-1); addIf(-1,1); addIf(1,-1); addIf(1,1);
      break;
    case 'L': // лучник — только вперёд на 1
      addIf(forward, 0);
      break;
  }
  return dirs;
}

/* ============ ЛОГИКА ИГРЫ ============ */

function currentPlayer() { return state.turn; }
function opponent(p) { return p === 1 ? 2 : 1; }

function piecesOnBoard(owner, type) {
  const res = [];
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) {
    const p = state.board[r][c];
    if (p && p.owner===owner && (!type || p.type===type)) res.push({r,c,piece:p});
  }
  return res;
}

function countAllPiecesOfPlayer(owner) {
  return piecesOnBoard(owner).length + state.reserves[owner].length;
}

// проверка легальности ввода из резерва
function canPlaceFromReserve(owner, index, r, c) {
  if (state.board[r][c]) return false;
  const piece = state.reserves[owner][index];
  if (!piece) return false;
  const type = piece.type;
  // лучник не может быть поставлен на последний ряд (для своего владельца)
  if (type === 'L') {
    const lastRow = owner === 1 ? 0 : ROWS-1;
    if (r === lastRow) return false;
  }
  // командир лучников при вводе обращается в обычного лучника
  // (по правилам: "если его съедают, то обратно на поле он вводится, как обычный лучник")
  return true;
}

// получить фигуру из резерва для ввода (с учётом превращения командира в лучника)
function getReservePieceForPlacement(owner, index) {
  const p = state.reserves[owner][index];
  if (!p) return null;
  if (p.type === 'C') return {type:'L', owner};
  return {type:p.type, owner};
}

// Клонирование состояния для проверки "остались ли ходы" у игрока
function snapshot() {
  return {
    board: state.board.map(row => row.map(clonePiece)),
    reserves: {
      1: state.reserves[1].map(clonePiece),
      2: state.reserves[2].map(clonePiece)
    }
  };
}

// Есть ли хоть один ход у игрока (по доске или ввод из резерва)?
function hasAnyMove(owner) {
  // ходы фигур на доске
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) {
    const p = state.board[r][c];
    if (p && p.owner===owner) {
      if (getMovesForPiece(p, r, c).length > 0) return true;
    }
  }
  // ввод из резерва
  if (state.reserves[owner].length > 0) {
    for (let i=0;i<state.reserves[owner].length;i++) {
      for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) {
        if (canPlaceFromReserve(owner, i, r, c)) return true;
      }
    }
  }
  return false;
}

// Шах ли князю игрока? (есть ли атакующая фигура противника, которая может побить князя)
function isKingInCheck(owner) {
  const kingPos = piecesOnBoard(owner, 'K')[0];
  if (!kingPos) return false; // князя нет (не должно случаться в норме, но подстрахуемся)
  const enemy = opponent(owner);
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) {
    const p = state.board[r][c];
    if (!p || p.owner !== enemy) continue;
    const moves = getMovesForPiece(p, r, c);
    for (const [dr,dc] of moves) {
      if (r+dr === kingPos.r && c+dc === kingPos.c) return true;
    }
  }
  return false;
}

// Симуляция хода для проверки, остаётся ли князь под шахом
function simulateBoardMove(fromR, fromC, toR, toC) {
  const snap = snapshot();
  const movingPiece = clonePiece(state.board[fromR][fromC]);
  const capturedPiece = clonePiece(state.board[toR][toC]);
  state.board[toR][toC] = movingPiece;
  state.board[fromR][fromC] = null;
  // превращение лучника в командира при достижении последнего ряда
  if (movingPiece.type === 'L') {
    const lastRow = movingPiece.owner === 1 ? 0 : ROWS-1;
    if (toR === lastRow) movingPiece.type = 'C';
  }
  const check = isKingInCheck(movingPiece.owner);
  // откат
  state.board = snap.board;
  state.reserves = snap.reserves;
  return check;
}

function simulatePlacement(owner, index, toR, toC) {
  const snap = snapshot();
  const pieceToPlace = getReservePieceForPlacement(owner, index);
  state.board[toR][toC] = pieceToPlace;
  state.reserves[owner].splice(index, 1);
  const check = isKingInCheck(owner);
  state.board = snap.board;
  state.reserves = snap.reserves;
  return check;
}

// Оставляет ли ход князя под шахом?
function moveLeavesKingInCheck(fromR, fromC, toR, toC) {
  const piece = state.board[fromR][fromC];
  if (!piece) return true;
  if (isKingInCheck(piece.owner)) return true; // если уже шах — нельзя проверить "после", но проверим симуляцией
  return simulateBoardMove(fromR, fromC, toR, toC);
}

/* ============ ОТРИСОВКА ============ */

const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');
const hintEl = document.getElementById('hint');
const logEl = document.getElementById('log');
const reserve1El = document.getElementById('reserve1');
const reserve2El = document.getElementById('reserve2');

function log(msg) {
  const d = document.createElement('div');
  d.textContent = msg;
  logEl.prepend(d);
}

function pieceLabel(type) {
  return { K:'Кн', V:'Вое', W:'Вит', L:'Луч', C:'Ком' }[type] || '?';
}

function render() {
  boardEl.innerHTML = '';
  for (let r=0;r<ROWS;r++) {
    for (let c=0;c<COLS;c++) {
      const cell = document.createElement('div');
      cell.className = 'cell ' + ((r+c)%2===0 ? 'light' : 'dark');
      cell.dataset.r = r; cell.dataset.c = c;

      const p = state.board[r][c];
      if (p) {
        const pd = document.createElement('div');
        pd.className = 'piece ' + (p.owner===1?'p1':'p2');
        pd.textContent = pieceLabel(p.type);
        cell.appendChild(pd);
      }

      // подсветка
      if (state.selected && state.selected.kind==='board' &&
          state.selected.r===r && state.selected.c===c) {
        cell.classList.add('sel');
      }
      if (state.legalMoves.some(m => m.r===r && m.c===c)) {
        cell.classList.add('target');
        if (p) cell.classList.add('capture');
      }
      if (state.lastMove) {
        const lm = state.lastMove;
        if ((lm.fromR===r&&lm.fromC===c)||(lm.toR===r&&lm.toC===c)) {
          cell.classList.add('lastmove');
        }
      }

      cell.addEventListener('click', () => onCellClick(r, c));
      boardEl.appendChild(cell);
    }
  }

  renderReserve(1, reserve1El);
  renderReserve(2, reserve2El);

  if (state.gameOver) {
    statusEl.textContent = 'Игра окончена! Победил игрок ' + state.winner;
    statusEl.classList.add('win');
  } else {
    const inCheck = isKingInCheck(state.turn);
    statusEl.textContent = 'Ход игрока ' + state.turn + ' (' + (state.turn===1?'красные':'синие') + ')' +
      (inCheck ? ' — ШАХ КНЯЗЮ!' : '');
    statusEl.classList.toggle('win', inCheck);
  }
}

function renderReserve(owner, el) {
  el.innerHTML = '';
  const arr = state.reserves[owner];
  if (arr.length === 0) {
    const span = document.createElement('span');
    span.style.fontSize='11px'; span.style.color='#888';
    span.textContent = 'пусто';
    el.appendChild(span);
    return;
  }
  arr.forEach((p, i) => {
    const d = document.createElement('div');
    d.className = 'piece ' + (owner===1?'p1':'p2');
    d.textContent = pieceLabel(p.type);
    if (state.selected && state.selected.kind==='reserve' &&
        state.selected.owner===owner && state.selected.index===i) {
      d.classList.add('sel');
    }
    if (state.gameOver || state.turn !== owner) d.classList.add('disabled');
    d.addEventListener('click', () => onReserveClick(owner, i));
    el.appendChild(d);
  });
}

/* ============ ОБРАБОТКА КЛИКОВ ============ */

function clearSelection() {
  state.selected = null;
  state.legalMoves = [];
}

function computeLegalMovesFromSelected() {
  state.legalMoves = [];
  if (!state.selected) return;
  if (state.selected.kind === 'board') {
    const {r,c} = state.selected;
    const p = state.board[r][c];
    if (!p) return;
    const owner = p.owner;
    const inCheck = isKingInCheck(owner);
    for (const [dr,dc] of getMovesForPiece(p, r, c)) {
      const nr = r+dr, nc = c+dc;
      // нельзя оставлять/приводить к шаху
      if (simulateBoardMove(r,c,nr,nc)) continue;
      state.legalMoves.push({r:nr, c:nc});
    }
  } else if (state.selected.kind === 'reserve') {
    const {owner, index} = state.selected;
    for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) {
      if (!canPlaceFromReserve(owner, index, r, c)) continue;
      if (simulatePlacement(owner, index, r, c)) continue;
      state.legalMoves.push({r, c});
    }
  }
}

function onCellClick(r, c) {
  if (state.gameOver) return;
  const turn = state.turn;

  // Если что-то выделено и клетка в списке легальных — делаем ход/ввод
  if (state.selected) {
    const target = state.legalMoves.find(m => m.r===r && m.c===c);
    if (target) {
      if (state.selected.kind === 'board') {
        doBoardMove(state.selected.r, state.selected.c, r, c);
      } else {
        doPlacement(state.selected.owner, state.selected.index, r, c);
      }
      return;
    }
  }

  const p = state.board[r][c];
  // клик по своей фигуре — выделить
  if (p && p.owner === turn) {
    state.selected = {kind:'board', r, c};
    computeLegalMovesFromSelected();
    hintEl.textContent = 'Выбрана фигура: ' + NAMES[p.type] + ' (' + (p.owner===1?'красные':'синие') + ')';
    render();
    return;
  }

  // клик по пустой/чужой без выделения — снять выделение
  clearSelection();
  hintEl.textContent = 'Выберите фигуру на доске или в резерве.';
  render();
}

function onReserveClick(owner, index) {
  if (state.gameOver) return;
  if (owner !== state.turn) return;
  state.selected = {kind:'reserve', owner, index};
  computeLegalMovesFromSelected();
  const piece = state.reserves[owner][index];
  hintEl.textContent = 'Ввод из резерва: ' + NAMES[piece.type] +
    (piece.type==='C' ? ' (станет лучником)' : '');
  render();
}

/* ============ ХОДЫ ============ */

function doBoardMove(fromR, fromC, toR, toC) {
  const movingPiece = state.board[fromR][fromC];
  const capturedPiece = state.board[toR][toC];
  const mover = movingPiece.owner;

  // перемещение
  state.board[toR][toC] = movingPiece;
  state.board[fromR][fromC] = null;
  state.lastMove = {fromR, fromC, toR, toC};

  // взятие
  if (capturedPiece) {
    // если съели командира лучников — в резерв попадёт обычный лучник
    if (capturedPiece.type === 'C') {
      state.reserves[mover].push({type:'L', owner: mover});
      log(`${NAMES[movingPiece.type]} (${mover===1?'кр':'син'}) съел Командира лучников — получен Лучник в резерв.`);
    } else {
      state.reserves[mover].push({type: capturedPiece.type, owner: mover});
      log(`${NAMES[movingPiece.type]} (${mover===1?'кр':'син'}) съел ${NAMES[capturedPiece.type]} — фигура в резерве.`);
    }
  } else {
    log(`${NAMES[movingPiece.type]} (${mover===1?'кр':'син'}) сделал ход.`);
  }

  // превращение лучника
  if (movingPiece.type === 'L') {
    const lastRow = mover === 1 ? 0 : ROWS-1;
    if (toR === lastRow) {
      movingPiece.type = 'C';
      log(`Лучник (${mover===1?'кр':'син'}) стал Командиром лучников!`);
    }
  }

  endTurnAndCheckWin(mover);
}

function doPlacement(owner, index, toR, toC) {
  const pieceToPlace = getReservePieceForPlacement(owner, index);
  state.reserves[owner].splice(index, 1);
  state.board[toR][toC] = pieceToPlace;
  state.lastMove = {fromR:-1, fromC:-1, toR, toC};
  log(`Игрок ${owner} ввёл ${NAMES[pieceToPlace.type]} на клетку (${toR+1},${toC+1}).`);
  endTurnAndCheckWin(owner);
}

function endTurnAndCheckWin(mover) {
  state.selected = null;
  state.legalMoves = [];

  // Проверки окончания игры
  // 1. Все фигуры у одного игрока
  const moverPieces = countAllPiecesOfPlayer(mover);
  const opp = opponent(mover);
  const oppPieces = countAllPiecesOfPlayer(opp);
  if (oppPieces === 0) {
    return endGame(mover, 'У противника не осталось фигур.');
  }
  // (обратный случай невозможен при корректном ходе, но на всякий)
  if (moverPieces === 0) {
    return endGame(opp, 'У игрока не осталось фигур.');
  }

  // 2. У противника нет князя => мат невозможен, но "все фигуры у одного" - уже проверено
  const oppKings = piecesOnBoard(opp, 'K');
  if (oppKings.length === 0) {
    return endGame(mover, 'Князь противника уничтожен.');
  }

  // 3. Ход переходит противнику. Проверяем, есть ли у него ходы (мат/пат по правилам)
  state.turn = opp;

  if (!hasAnyMove(opp)) {
    // по правилам игра заканчивается, если у князя противника не осталось ходов
    return endGame(mover, 'У князя противника не осталось ходов (мат/пат).');
  }

  // Примечание: князь не может быть "съеден" в этой игре,
  // т.к. ход, оставляющий своего князя под боем, запрещён, а съесть князя = поставить мат.
  // Но проверка на всякий случай:
  if (piecesOnBoard(opp, 'K').length === 0) {
    return endGame(mover, 'Князь противника повержен.');
  }

  render();
}

function endGame(winner, reason) {
  state.gameOver = true;
  state.winner = winner;
  state.selected = null;
  state.legalMoves = [];
  log(`ПОБЕДА игрока ${winner}! ${reason || ''}`);
  render();
}

/* ============ СТАРТ ============ */
document.getElementById('restart').addEventListener('click', startGame);

function startGame() {
  state = createInitialState();
  statusEl.classList.remove('win');
  logEl.innerHTML = '';
  hintEl.textContent = 'Выберите фигуру на доске или в резерве.';
  log('Новая игра начата.');
  render();
}

startGame();
</script>
</body>
</html>
